<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Kartavya</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--kraft:#d8b98a;--kraft2:#c49e6c;--ink:#4a3320;--pink:#e07bb0;--glow:#fff3b0}
@media(prefers-color-scheme:dark){:root{--kraft:#b99467;--kraft2:#9c7748;--ink:#2e1f12}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 30% 20%,#e6cc9f,var(--kraft) 55%,var(--kraft2));color:var(--ink);font-family:Caveat,"Bradley Hand",cursive;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.s{position:absolute;color:#fff8d6;text-shadow:0 0 6px #fff,0 0 12px #f7c948;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--l)}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
.stage{position:relative;z-index:1;margin-top:16vh;width:min(92vw,calc(58vh*1.408));perspective:1600px}
.book{position:relative;width:100%;aspect-ratio:419/297;filter:drop-shadow(0 14px 18px rgba(60,35,10,.4))}
.page{position:absolute;inset:0;border:0;padding:0;background:#f3ead8 center/cover no-repeat;border-radius:4px;cursor:pointer;transform-origin:50% 0;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .5s .5s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.page:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.page.flipped{transform:rotateX(-100deg) translateY(-6%);opacity:0;pointer-events:none}
.spiral{position:absolute;left:3%;right:3%;bottom:calc(100% - 3px);height:16px;z-index:50;display:flex;justify-content:space-between;pointer-events:none}
.spiral i{width:5px;height:100%;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#7d8088,#f2f3f6 45%,#7d8088);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.hint{position:relative;z-index:1;margin:5vh 12px 0;font-size:clamp(20px,4.5vw,28px);text-align:center;min-height:2.4em}
.hint b{color:#a2406f;font-weight:600}
#again{font:inherit;font-size:24px;background:var(--pink);color:#fff;border:0;border-radius:30px;padding:6px 22px;cursor:pointer;display:none;box-shadow:0 3px 0 #a2406f}
#again.show{display:inline-block}
.hint .msg{display:block}
.page:not(.flipped){transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .15s}
.stage,.hint{transition:opacity .9s}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:min(62vw,300px);overflow:visible}
.flame{fill:#ffb52e;transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate;filter:drop-shadow(0 0 5px #ffd96b)}
@keyframes fl{from{transform:scale(1) rotate(-5deg)}to{transform:scale(.88,1.15) rotate(5deg)}}
.blown .flame{animation:none;transform:scale(0);opacity:0;transition:transform .35s var(--fd),opacity .35s var(--fd)}
.smoke{fill:#fffdf4;opacity:0;transform-box:fill-box;transform-origin:center}
.blown .smoke{animation:sm 1.6s ease-out var(--fd) forwards}
@keyframes sm{0%{opacity:.8;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-45px) scale(1.7)}}
#cap{margin-top:16px;font-size:clamp(24px,6vw,34px);color:var(--ink);text-align:center;padding:0 14px;transition:opacity .4s}
.blown #cap{opacity:0}
#cnt{font-size:clamp(52px,15vw,96px);margin-top:14px;color:#a2406f;min-height:1.1em;line-height:1;text-align:center}
#cnt.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
#skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font:inherit;font-size:22px;background:none;border:0;color:var(--ink);opacity:.7;cursor:pointer}
#back{font:inherit;font-size:24px;background:#fff8e8;color:#a2406f;border:2px solid #a2406f;border-radius:30px;padding:4px 20px;cursor:pointer;display:none;margin-right:8px}
#back.show{display:inline-block}
@media(prefers-reduced-motion:reduce){.page,.s,.page.next{transition:none;animation:none}}
</style></head><body>

 again.classList.toggle('show',idx>=N);document.getElementById('back').classList.toggle('show',idx>0)}
function turn(k){if(k!==idx)return;if(k===N-1){/* last page: stays as final, show replay */idx=N;pages[k].classList.remove('next');ui();return}
 pages[k].classList.add('flipped');idx++;ui()}
again.onclick=function(){pages.forEach(function(p){p.classList.remove('flipped')});idx=0;ui()};
function goBack(){if(idx<=0)return;if(idx>=N){idx=N-1}else{idx--;pages[idx].classList.remove('flipped')}ui()}

document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')goBack();else if(e.key==='ArrowRight'&&idx<N)turn(idx)});
